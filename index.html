<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Clientes Estraich's</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #56025a;
      margin: 20px auto;
      max-width: 600px;
      padding: 20px;
      color: #56025a;
    }
    h1 {
      text-align: center;
      color: #eb51b3;
      margin-bottom: 30px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      flex: 1 1 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
      border-color: #197c06;
      outline: none;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      background-color: #cb719f;
      transition: background-color 0.3s ease;
      flex: 1 1 48%;
      max-width: 200px;
    }
    button:hover {
      background-color: #290052;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      background-color: white;
    }
    thead th {
      background-color: #cb7188;
      color: white;
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #cb7188;
    }
    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
    }
    tbody tr:hover {
      background-color: #290052;
    }
  </style>
</head>
<body>

<h1>Cadastro de Clientes Estraich's</h1>

<form>
  <input type="text" id="nome" placeholder="Nome">
  <input type="email" id="email" placeholder="Email">
  <input type="tel" id="celular" placeholder="Celular">
  <button type="button" onclick="cadastrarCliente()">Cadastrar</button>
  <button type="button" onclick="gerarPDF()">Salvar em PDF</button>
</form>

<table id="tabela">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Email</th>
      <th>Celular</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
function cadastrarCliente() {
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefone = document.getElementById('celular').value.trim();
 
  if (!nome || !email || !celular) {
    alert('Preencha todos os campos!');
    return;
  }

  const tabela = document.querySelector('#tabela tbody');
  const linha = document.createElement('tr');
  linha.innerHTML = `<td>${nome}</td><td>${email}</td><td>${celular}</td>`;
 
  tabela.appendChild(linha);
 
  document.getElementById('nome').value = '';
  document.getElementById('email').value = '';
  document.getElementById('celular').value = '';
}

function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
 
  doc.setFontSize(14);
  doc.text('Lista de Clientes Estraich', 14, 14);
 
  const linhasTabela = document.querySelectorAll('#tabela tbody tr');
  const dados = [];
 
  linhasTabela.forEach((linha) => {
    const nome = linha.children[0].innerText;
    const email = linha.children[1].innerText;
    const telefone = linha.children[2].innerText;
    dados.push([nome, email, celular]);
  });
 
  doc.autoTable({
    head: [['Nome', 'Email', 'Celular']],
    body: dados,
    startY: 20,
    styles: { fontSize: 10, cellPadding: 3 },
    columnStyles: {
      0: { cellWidth: 'auto' },
      1: { cellWidth: 'auto' },
      2: { cellWidth: 'auto' }
    }
  });

  doc.save('clientes.pdf');
}
</script>

</body>
